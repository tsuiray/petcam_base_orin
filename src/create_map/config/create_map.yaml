# create_map — Orin base station IMU path mapping
#
# Locked to ESP32 firmware:
#   repo:   https://github.com/tsuiray/petcam_esp32_s3
#   branch: cursor/esp32-arduino-hardening-26d4
#   node:   petcam_esp32_imu
#   topic:  /imu/data  (sensor_msgs/Imu, BEST_EFFORT, 50 Hz / 20 ms)
#   units:  accel m/s^2, gyro rad/s, frame_id=imu_link
#   agent:  UDP 8888

imu_odometry:
  ros__parameters:
    imu_topic: "/imu/data"
    raw_imu_topic: "/imu/raw"
    prefer_raw: false

    frame_id: "map"
    child_frame_id: "base_link"

    max_dt_sec: 0.1
    min_dt_sec: 0.001

    accel_in_g: false
    gravity: 9.80665

    # ZUPT only after sustained stillness (do NOT zero every sample — that
    # kills coasting motion where |a|≈g and left distance stuck at 0).
    enable_zupt: true
    zupt_accel_epsilon: 0.45
    zupt_gyro_epsilon: 0.15
    zupt_hold_sec: 0.35

    calibrate_on_start_sec: 1.0
    path_max_poses: 5000
    path_min_step_m: 0.002
    publish_tf: true

map_viewer:
  ros__parameters:
    path_topic: "/create_map/path"
    pose_topic: "/create_map/pose"
    distance_topic: "/create_map/distance"
    debug_topic: "/create_map/debug"
    window_name: "PetCam create_map"
    pixels_per_meter: 200.0
    trail_thickness: 3
    show_grid: true
    grid_spacing_m: 0.25

mock_imu:
  ros__parameters:
    imu_topic: "/imu/data"
    rate_hz: 50.0
    accel_peak: 0.4
