# create_map — Orin base station IMU path mapping
#
# Locked to ESP32 firmware:
#   repo:   https://github.com/tsuiray/petcam_esp32_s3
#   branch: cursor/esp32-arduino-hardening-26d4
#   node:   petcam_esp32_imu
#   topic:  /imu/data  (sensor_msgs/Imu, BEST_EFFORT, 50 Hz / 20 ms)
#   units:  accel m/s^2, gyro rad/s, frame_id=imu_link
#   agent:  UDP 8888

imu_odometry:
  ros__parameters:
    imu_topic: "/imu/data"
    # Fallback only — ESP32 firmware does not publish this today
    raw_imu_topic: "/imu/raw"
    prefer_raw: false

    frame_id: "map"
    child_frame_id: "base_link"

    # ESP32 IMU_PUBLISH_PERIOD_MS = 20 → expect ~0.02 s packet gaps
    max_dt_sec: 0.1
    min_dt_sec: 0.001

    # mpu6050.cpp converts ±2g / ±250 dps into SI already
    accel_in_g: false
    gravity: 9.80665

    enable_zupt: true
    zupt_accel_epsilon: 0.35
    zupt_gyro_epsilon: 0.08

    # Keep robot still ~1 s after link-up for horizontal bias
    calibrate_on_start_sec: 1.0

    path_max_poses: 5000
    publish_tf: true

map_viewer:
  ros__parameters:
    path_topic: "/create_map/path"
    pose_topic: "/create_map/pose"
    window_name: "PetCam create_map"
    pixels_per_meter: 80.0
    trail_thickness: 2
    show_grid: true
    grid_spacing_m: 0.5

mock_imu:
  ros__parameters:
    imu_topic: "/imu/data"
    rate_hz: 50.0
    accel_peak: 0.4
